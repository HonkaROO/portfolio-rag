services:
  - type: web
    name: gumanit-portfolio-api
    runtime: python

    pythonVersion: "3.11.10"

    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_KEY
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: AZURE_OPENAI_API_KEY
        sync: false

      - key: AZURE_OPENAI_ENDPOINT
        sync: false

      - key: LLM_MODEL
        value: llama-3.1-8b-instant

      - key: ALLOWED_ORIGINS
        value: https://your-portfolio.vercel.app